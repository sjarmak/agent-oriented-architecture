[workspace]
members = ["crates/*"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.94"
license = "MIT"

[workspace.dependencies]
serde = { version = "1.0.219", features = ["derive"] }
# float_roundtrip: committed JSON artifacts (correlation reports, corpus rows)
# carry arbitrary f64 values that must parse back to the exact double they were
# printed from; the default fast parse can be one ULP off, which breaks the
# artifact-reproducibility tests in aoa-construct and aoa-corpus.
serde_json = { version = "1.0.140", features = ["float_roundtrip"] }
serde_jcs = "=0.2.0"
thiserror = "2.0.12"
