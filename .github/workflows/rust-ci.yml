name: Rust CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: rust-ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      # The architecture dead-link guard is fail-closed (blocks the Pages
      # deploy); these tests pin that contract so it can't silently regress
      # to advisory again. Needs only the runner's preinstalled Node (node:
      # builtins, no npm deps), so it runs first and fails in seconds.
      - name: Architecture link-guard tests
        run: node --version && node --test architecture/site/check-links.test.mjs
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      # Dogfood: the toolkit audits its own repository. Runs before the ESLint
      # install below so its best-effort indexer doesn't walk node_modules.
      # Non-gating for now — `aoa audit --repo .` prints the full punch-list on
      # every run, including the one known Tier-1 gap (missing runtime-hook
      # enforcement plane), so nothing is hidden. Flip to `--fail-on tier1`
      # once that gap is closed (tracked in aoa-vrx.3) so future Tier-1
      # regressions gate CI.
      - name: Self-audit (aoa audit)
        run: cargo run -p aoa -- audit --repo .
      # Node + the vendored, pinned ESLint the aoa-migrate TypeScript adapter
      # tests need. Absent it those tests skip (they self-guard) rather than
      # exercising the adapter, so CI installs it to run them for real; see
      # crates/aoa-migrate/tests/imports_typescript.rs.
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: crates/aoa-migrate/assets/eslint/package-lock.json
      - name: Install vendored ESLint (hermetic)
        run: npm ci
        working-directory: crates/aoa-migrate/assets/eslint
      - name: Test
        run: cargo test --workspace
  # Workspace coverage, measured and gated. Separate job so the instrumented
  # build (different artifacts, ~2-4x slower) never sits on the fmt/clippy/test
  # critical path and a coverage failure is diagnosable on its own.
  # No --ignore-filename-regex: the workspace has no generated or vendored Rust
  # (the vendored ESLint under crates/aoa-migrate/assets is JavaScript, invisible
  # to Rust coverage), so nothing is excluded and nothing is masked.
  coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      # Default per-job cache scoping isolates this cache from the ci job's.
      # Do NOT add a shared-key spanning both jobs: it would mix
      # -Cinstrument-coverage objects into the uninstrumented build.
      - uses: Swatinem/rust-cache@v2
      # Bump the pin deliberately, alongside a threshold re-check. The
      # toolchain itself floats on @stable like the ci job, so rustc/LLVM
      # bumps can still shift counts slightly — the 13-point margin between
      # baseline and gate absorbs that.
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov@0.8.7
      # Same hermetic ESLint install as the ci job (rationale documented there),
      # plus a pinned ruff: both aoa-migrate adapter test suites self-skip when
      # their tool is absent, and coverage must be over the complete suite, not
      # a silently reduced one.
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: crates/aoa-migrate/assets/eslint/package-lock.json
      - name: Install vendored ESLint (hermetic)
        run: npm ci
        working-directory: crates/aoa-migrate/assets/eslint
      - name: Install ruff (pinned)
        run: pipx install ruff==0.15.8
      # Drop any profraw/profdata restored from cache so counts can never
      # accumulate across runs — correctness must not depend on rust-cache's
      # incidental pre-save cleanup of the llvm-cov-target dir.
      - name: Clean stale coverage data
        run: cargo llvm-cov clean --workspace
      # No --all-features/--all-targets: the workspace currently defines no
      # features, examples, or benches; add the flags if that changes.
      - name: Collect coverage
        run: cargo llvm-cov --workspace --no-report
      # lcov export is decoupled from enforcement and runs even when collection
      # or the gate fails, so the artifact exists exactly when it's needed to
      # diagnose missed paths. (!cancelled(), not always(): a run superseded
      # via cancel-in-progress shouldn't burn runner time on abandoned data.)
      - name: Export lcov
        if: ${{ !cancelled() }}
        run: cargo llvm-cov report --lcov --output-path lcov.info
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: coverage-lcov
          path: lcov.info
      # Gate last, reusing the already-collected profdata. This step also
      # prints the per-file coverage table before enforcing, so a below-
      # threshold failure carries its own diagnosis in the log. Threshold is
      # the 80% line-coverage engineering contract; measured baseline at
      # introduction (2026-07-19, cargo-llvm-cov 0.8.7) was 93.30% lines.
      - name: Report coverage and enforce threshold
        run: cargo llvm-cov report --fail-under-lines 80
