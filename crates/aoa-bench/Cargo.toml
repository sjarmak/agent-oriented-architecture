[package]
name = "aoa-bench"
description = "codeprobe adapter: turns mined task dirs into AOA task inputs and owns the run-dir scoring/provenance contract (contamination-free held-out substrate)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
aoa-domain = { path = "../aoa-domain" }
serde = { workspace = true }
serde_json = { workspace = true }
serde_jcs = { workspace = true }
sha2 = "0.10.9"
thiserror = { workspace = true }
toml = { version = "1.1.2", default-features = false, features = ["parse", "serde"] }

[dev-dependencies]
# Dev-only on purpose. `loader_test.rs` asserts the seam this crate exists to
# serve: a task loaded with no held-out leg drives `compute_gap` to
# `Unavailable`, and an external one to `Available`. That is a real property of
# the loader, provable only by running the gate. A dev-dependency does not enter
# any consumer's build graph, so it does not reintroduce the inputs -> measurement
# edge this crate just shed (aoa-ynqcn) — a normal dependency would.
aoa-gap = { path = "../aoa-gap" }
tempfile = "3.10.1"
