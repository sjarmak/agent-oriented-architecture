[package]
name = "aoa-scip-graph"
description = "Index a target repo into an aoa_metrics::SymbolGraph (SCIP high-confidence, AST best-effort, or degraded) with R15 confidence tiering."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
aoa-trace = { path = "../aoa-trace" }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
# Only tests/tiers.rs needs this, for compute_metrics; production code (this
# crate produces a SymbolGraph, it doesn't score one) depends on aoa-trace
# alone (aoa-00f).
aoa-metrics = { path = "../aoa-metrics" }
