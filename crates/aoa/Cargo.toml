[package]
name = "aoa"
description = "User-facing CLI for the AOA Toolkit: wires every Wave-0 subcommand to its library crate, with fail-loud forge adapters and human + JSON dual-register output"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[[bin]]
name = "aoa"
path = "src/main.rs"

[dependencies]
aoa-trace = { path = "../aoa-trace" }
aoa-budget = { path = "../aoa-budget" }
aoa-lint = { path = "../aoa-lint" }
aoa-construct = { path = "../aoa-construct" }
aoa-corpus = { path = "../aoa-corpus" }
aoa-domain = { path = "../aoa-domain" }
aoa-gap = { path = "../aoa-gap" }
aoa-audit = { path = "../aoa-audit" }
aoa-migrate = { path = "../aoa-migrate" }
aoa-recommend = { path = "../aoa-recommend" }
aoa-falsify = { path = "../aoa-falsify" }
aoa-falsify-build = { path = "../aoa-falsify-build" }
aoa-metrics = { path = "../aoa-metrics" }
aoa-bench = { path = "../aoa-bench" }
aoa-scip-graph = { path = "../aoa-scip-graph" }
aoa-codeprobe-shim = { path = "../aoa-codeprobe-shim" }
aoa-enforce = { path = "../aoa-enforce" }
aoa-policy = { path = "../aoa-policy" }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
clap = { version = "4.5.40", features = ["derive"] }
anyhow = "1.0.98"
sha2 = "0.10.9"

[dev-dependencies]
assert_cmd = "2.0.16"
predicates = "3.1.2"
tempfile = "3.10.1"
# `architecture_doc.rs` reads every crate manifest to check layer order. Parsing
# them properly matters: a hand-rolled line scanner that missed a dependency
# table form would fail open, passing the order check by finding no edges.
toml = { version = "1.1.2", default-features = false, features = ["parse"] }
