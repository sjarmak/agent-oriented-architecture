[package]
name = "aoa-observe-shim"
description = "Turns observe-captured live-session logs under .aoa/traces into the native AOA trace stream — the present-time sibling of the aoa-codeprobe-shim past-commit adapter"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
aoa-trace = { path = "../aoa-trace" }
aoa-codeprobe-shim = { path = "../aoa-codeprobe-shim" }
serde_json = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
jsonschema = { version = "0.58.6", default-features = false }
tempfile = "3.10.1"
