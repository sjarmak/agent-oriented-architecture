[package]
name = "aoa-corpus"
description = "External-outcome corpus for the AOA Toolkit: git revert mining, the Factory checkbox baseline rubric, and exact Spearman rank correlation"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
# One-directional: the corpus joins mined outcomes onto the construct-validity
# report; aoa-construct knows nothing about corpora.
aoa-construct = { path = "../aoa-construct" }
serde = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
serde_json = { workspace = true }
# tempfile: checkbox_baseline fixture tests build synthetic repo trees in
# tempdirs to exercise Factory-level boundaries (same pin as aoa-audit).
tempfile = "3.10.1"
